name: Sync CricHeroes stats

on:
  schedule:
    # Every Monday at 06:00 UTC — adjust as you like (cron is UTC).
    - cron: "0 6 * * 1"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the stats sync
        run: python sync_stats.py

      - name: Commit updated stats (if anything changed)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Sync player stats and recent matches from CricHeroes"
          file_pattern: players.json
